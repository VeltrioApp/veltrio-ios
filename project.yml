name: Veltrio
options:
  bundleIdPrefix: com.veltrio
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

packages:
  MPVKit:
    url: https://github.com/mpvkit/MPVKit
    exactVersion: 1.1.0-n9.0.2

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    VELTRIO_SIMKL_CLIENT_ID: ""

targets:
  Veltrio:
    type: application
    platform: iOS
    sources:
      - path: Veltrio
      # VeltrioKit, from the macOS repository (a submodule in macos/): the
      # services, the theme and the translations.
      - path: macos/Shared
      - path: macos/Veltrio/Views
        # The Mac's video surface; iOS has its own (Veltrio/Player).
        excludes: [MPVPlayer.swift]
      - path: Core/Bindings/veltrio.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.veltrio.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Veltrio/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Veltrio
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
        # Chromecasts and Veltrio TVs are found on the local network.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Veltrio cherche les Chromecast et les TV Veltrio sur votre réseau local."
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Core/Bindings
    dependencies:
      - package: MPVKit
        product: MPVKit
      # The Rust core: a dynamic framework, embedded and signed.
      - framework: Core/veltrioFFI.xcframework
        embed: true
        codeSign: true
      - sdk: SystemConfiguration.framework
      - sdk: Security.framework
